<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교실 자리 배치 도구</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            user-select: none;
        }
        /* 셔플 애니메이션 효과 */
        .seat-card {
            transition: all 0.3s ease-in-out;
        }
        .seat-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-3 sm:p-6">

    <!-- 
    ===================================================================
    [선생님 전용 설정 구역]
    나중에 조건을 바꾸실 때는 아래 script 내 CONFIG 객체의 값만 수정하시면 됩니다.
    ===================================================================
    -->
    <script>
        const CONFIG = {
            // 전체 학생 수
            TOTAL_STUDENTS: 27,
            
            // 교실 책상 배열 (줄 x 칸)
            ROWS: 5,
            COLS: 6,

            // 1. 앞줄(교탁 바로 앞줄)에 고정 배치할 학생 번호 목록
            FRONT_ROW_STUDENTS: [25, 16],

            // 2. 서로 떨어뜨려 놓아야 하는 학생 번호 짝들 (상하좌우 및 대각선 접촉 방지)
            SEPARATE_PAIRS: [
                [10, 14], // 10번과 14번 분리
                [25, 16]  // 25번과 16번 분리
            ],

            // 교사 시선 모드 (true: 교탁 바로 밑이 1줄/앞줄, false: 교탁 반대쪽이 1줄)
            TEACHER_VIEW_MODE: true,

            // 최대 셔플 시도 횟수
            MAX_ATTEMPTS: 2000
        };
    </script>

    <!-- 상단 헤더 & 컨트롤 바 -->
    <header class="max-w-6xl mx-auto w-full mb-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-4xl font-extrabold text-amber-400 tracking-tight flex items-center gap-3">
                    <span>🏫</span> 교실 자리 배치기 <span class="text-xs sm:text-base font-normal bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full">👨‍🏫 교사 시선 모드</span>
                </h1>
                <p class="text-slate-400 text-sm sm:text-base mt-1">
                    총 <span id="info-total" class="font-bold text-slate-200"></span>명 | 
                    앞줄 고정: <span id="info-front" class="font-bold text-amber-300"></span> | 
                    분리 짝: <span id="info-pairs" class="font-bold text-rose-400"></span>
                </p>
            </div>

            <!-- 컨트롤 버튼 그룹 -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button id="btn-shuffle" onclick="generateSeating()" class="w-full md:w-auto bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xl sm:text-2xl px-8 py-4 rounded-xl shadow-lg hover:shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>다시 섞기</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 대형 메인 영역 -->
    <main class="max-w-6xl mx-auto w-full flex-1 flex flex-col justify-center items-center gap-4 sm:gap-6">
        
        <!-- 교탁 표시 -->
        <div class="w-full max-w-md bg-gradient-to-r from-slate-800 via-slate-700 to-slate-800 border-2 border-amber-500/40 text-amber-300 font-black text-xl sm:text-2xl py-3 rounded-2xl text-center shadow-lg tracking-widest flex items-center justify-center gap-2">
            <span>📺</span> [ 교 탁 (선생님 위치) ] <span>📺</span>
        </div>

        <div class="text-xs sm:text-sm font-semibold text-amber-400/80 -mt-2">
            ↓ 교탁 바로 앞줄 (1줄 - 시력 보호 학생 지정석) ↓
        </div>

        <!-- 경고/안내 메시지 -->
        <div id="status-message" class="hidden w-full max-w-xl text-center p-3 rounded-xl font-bold text-lg"></div>

        <!-- 자리 배치 판 (그리드) -->
        <div id="grid-container" class="w-full grid gap-2 sm:gap-4 p-2 sm:p-4 bg-slate-950/60 rounded-3xl border border-slate-800 shadow-2xl">
            <!-- 자리가 JS로 생성됩니다. -->
        </div>

        <div class="text-xs sm:text-sm font-semibold text-slate-500">
            ↑ 교실 맨 뒷줄 ↑
        </div>
    </main>

    <!-- 하단 상태 범례 -->
    <footer class="max-w-6xl mx-auto w-full mt-4 text-center">
        <div class="inline-flex flex-wrap justify-center items-center gap-4 bg-slate-800/80 px-6 py-3 rounded-full border border-slate-700 text-xs sm:text-sm text-slate-300">
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full bg-amber-500/20 border border-amber-500 inline-block"></span>
                <span>앞줄 고정 학생</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full bg-rose-500/20 border border-rose-500 inline-block"></span>
                <span>분리 조건 적용 학생</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 inline-block"></span>
                <span>일반 자리 / 빈 책상</span>
            </div>
        </div>
    </footer>

    <script>
        // 초기화 및 정보 표시
        document.addEventListener('DOMContentLoaded', () => {
            initInfo();
            generateSeating();
        });

        function initInfo() {
            document.getElementById('info-total').innerText = CONFIG.TOTAL_STUDENTS;
            document.getElementById('info-front').innerText = CONFIG.FRONT_ROW_STUDENTS.length > 0 
                ? CONFIG.FRONT_ROW_STUDENTS.map(n => n + '번').join(', ') 
                : '없음';
            
            document.getElementById('info-pairs').innerText = CONFIG.SEPARATE_PAIRS.length > 0 
                ? CONFIG.SEPARATE_PAIRS.map(p => `(${p[0]}번, ${p[1]}번)`).join(' ') 
                : '없음';

            // 동적 그리드 설정
            const container = document.getElementById('grid-container');
            container.style.gridTemplateColumns = `repeat(${CONFIG.COLS}, minmax(0, 1fr))`;
        }

        // 자리 배치 메인 로직
        function generateSeating() {
            const btn = document.getElementById('btn-shuffle');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const statusMsg = document.getElementById('status-message');
            statusMsg.classList.add('hidden');

            let seatingPlan = null;
            let attempts = 0;

            // 조건에 부합하는 배치를 찾을 때까지 시도
            while (attempts < CONFIG.MAX_ATTEMPTS) {
                attempts++;
                const candidate = createRandomLayout();
                if (validateLayout(candidate)) {
                    seatingPlan = candidate;
                    break;
                }
            }

            if (!seatingPlan) {
                // 조건 완화 필요 시 알림
                statusMsg.className = "w-full max-w-xl text-center p-3 rounded-xl font-bold text-lg bg-rose-900/80 text-rose-200 border border-rose-600 block";
                statusMsg.innerText = "⚠️ 입력하신 조건을 모두 만족하는 배치를 찾지 못했습니다. 다시 시도해 주세요.";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
            }

            // 배치 애니메이션 및 출력
            renderLayoutWithAnimation(seatingPlan, () => {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        }

        // 무작위 기본 배치 생성 함수
        function createRandomLayout() {
            const totalDesks = CONFIG.ROWS * CONFIG.COLS;
            const grid = Array(totalDesks).fill(null);

            // 학생 번호 배열 생성 (1 ~ TOTAL_STUDENTS)
            let remainingStudents = Array.from({ length: CONFIG.TOTAL_STUDENTS }, (_, i) => i + 1);

            // 1. 앞줄 고정 학생들 처리
            // 교사 시선 모드(TEACHER_VIEW_MODE=true)일 때는 교탁 바로 아래인 0행(0 ~ COLS-1)이 앞줄이 됩니다.
            const frontSlots = Array.from({ length: CONFIG.COLS }, (_, i) => i);
            shuffleArray(frontSlots);

            const frontStudents = [...CONFIG.FRONT_ROW_STUDENTS];
            shuffleArray(frontStudents);

            frontStudents.forEach(student => {
                const slot = frontSlots.pop();
                grid[slot] = student;
                // 남은 학생 목록에서 제거
                const idx = remainingStudents.indexOf(student);
                if (idx > -1) remainingStudents.splice(idx, 1);
            });

            // 2. 중간에 빈 자리가 없도록 교탁 앞(0번 슬롯)부터 연속해서 채움
            // 남는 빈 자리는 맨 뒷줄(마지막 인덱스들)에 놓이게 됨
            const availableSlots = [];
            for (let i = 0; i < CONFIG.TOTAL_STUDENTS; i++) {
                if (grid[i] === null) {
                    availableSlots.push(i);
                }
            }

            shuffleArray(availableSlots);
            shuffleArray(remainingStudents);

            remainingStudents.forEach(student => {
                const slot = availableSlots.pop();
                grid[slot] = student;
            });

            return grid;
        }

        // 제약조건 검증 (떨어져야 할 학생 쌍 분리 여부 확인)
        function validateLayout(grid) {
            for (const [s1, s2] of CONFIG.SEPARATE_PAIRS) {
                const pos1 = grid.indexOf(s1);
                const pos2 = grid.indexOf(s2);

                if (pos1 !== -1 && pos2 !== -1) {
                    const r1 = Math.floor(pos1 / CONFIG.COLS);
                    const c1 = pos1 % CONFIG.COLS;
                    const r2 = Math.floor(pos2 / CONFIG.COLS);
                    const c2 = pos2 % CONFIG.COLS;

                    // 상하좌우 및 대각선 바로 옆에 붙어있는지 체크 (행 차이 <= 1 이고 열 차이 <= 1)
                    if (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1) {
                        return false;
                    }
                }
            }
            return true;
        }

        // 배열 무작위 셔플 (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 화면 렌더링 & 연출 애니메이션
        function renderLayoutWithAnimation(seatingPlan, onComplete) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            // 셀 요소 사전 생성
            const cells = [];
            for (let i = 0; i < seatingPlan.length; i++) {
                const cell = document.createElement('div');
                cell.className = 'seat-card aspect-square sm:aspect-[4/3] flex flex-col items-center justify-center rounded-xl font-black text-slate-100 shadow-md border-2 border-slate-700 bg-slate-800/90 text-xl sm:text-3xl md:text-4xl';
                container.appendChild(cell);
                cells.push(cell);
            }

            // 셔플 애니메이션 효과 (숫자가 빠르게 바뀜)
            let frame = 0;
            const maxFrames = 12;
            const interval = setInterval(() => {
                frame++;
                for (let i = 0; i < seatingPlan.length; i++) {
                    if (frame < maxFrames) {
                        const randomNum = Math.floor(Math.random() * CONFIG.TOTAL_STUDENTS) + 1;
                        cells[i].innerHTML = `<span class="text-slate-500 font-normal">${randomNum}</span>`;
                    } else {
                        // 최종 값 세팅
                        const student = seatingPlan[i];
                        updateCellDesign(cells[i], student, i);
                    }
                }

                if (frame >= maxFrames) {
                    clearInterval(interval);
                    onComplete();
                }
            }, 50);
        }

        // 카드 디자인 업데이트 (고정학생, 분리학생, 빈자리 등 처리)
        function updateCellDesign(cell, student, index) {
            cell.classList.add('seat-pop');
            
            if (student === null) {
                // 빈 책상
                cell.className = 'seat-card aspect-square sm:aspect-[4/3] flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-800 bg-slate-900/40 text-slate-600 text-xs sm:text-sm font-semibold rotate-180';
                cell.innerHTML = '<span>빈자리</span>';
                return;
            }

            const isFrontFixed = CONFIG.FRONT_ROW_STUDENTS.includes(student);
            const isSeparatedPair = CONFIG.SEPARATE_PAIRS.some(pair => pair.includes(student));

            let bgStyle = "bg-slate-800 border-slate-700 text-slate-100";
            let badge = "";

            if (isFrontFixed) {
                bgStyle = "bg-amber-500/20 border-amber-500 text-amber-300 shadow-amber-500/10";
                badge = `<span class="text-[10px] sm:text-xs font-bold text-amber-400 bg-amber-950/80 px-1.5 py-0.5 rounded mt-1 border border-amber-500/40">앞줄고정</span>`;
            } else if (isSeparatedPair) {
                bgStyle = "bg-rose-500/20 border-rose-500 text-rose-300 shadow-rose-500/10";
                badge = `<span class="text-[10px] sm:text-xs font-bold text-rose-400 bg-rose-950/80 px-1.5 py-0.5 rounded mt-1 border border-rose-500/40">거리유지</span>`;
            }

            // rotate-180 클래스를 추가하여 교탁(위쪽)에 계신 선생님 시선에서 똑바로 보이도록 회전 처리
            cell.className = `seat-card aspect-square sm:aspect-[4/3] flex flex-col items-center justify-center rounded-xl font-black shadow-md border-2 ${bgStyle} transition-all transform hover:scale-105 rotate-180`;
            
            cell.innerHTML = `
                <span class="text-2xl sm:text-4xl md:text-5xl tracking-tight">${student}<span class="text-xs sm:text-lg font-normal ml-0.5">번</span></span>
                ${badge}
            `;
        }
    </script>
</body>
</html>
